# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install the repository npm version"
              run: "npm install --global --ignore-scripts npm@12.0.2"

            - name: "Resolve npm cache directory"
              id: "npm-cache"
              run: |
                  echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: "Cache npm downloads"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm-cache.outputs.directory }}"
                  key: "${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}"
                  restore-keys: "${{ runner.os }}-npm-"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npm run coverage -- --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --silent"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Detect Codecov token"
              id: "codecov-token"
              if: "${{ !cancelled() }}"
              env:
                  CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
              run: |
                  if [ -n "$CODECOV_TOKEN" ]; then
                    echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "available=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() && steps.codecov-token.outputs.available == 'true' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              env:
                  CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
              with:
                  token: "${{ env.CODECOV_TOKEN }}"
                  slug: "Nick2bad4u/remark-lint-doc-headings"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() && steps.codecov-token.outputs.available == 'true' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              env:
                  CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
              with:
                  token: "${{ env.CODECOV_TOKEN }}"
                  slug: "Nick2bad4u/remark-lint-doc-headings"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    verify:
        name: "Verify pipeline"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        permissions:
            contents: "read"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install the repository npm version"
              run: "npm install --global --ignore-scripts npm@12.0.2"

            - name: "Resolve npm cache directory"
              id: "npm-cache"
              run: |
                  echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: "Cache npm downloads"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm-cache.outputs.directory }}"
                  key: "${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}"
                  restore-keys: "${{ runner.os }}-npm-"

            - name: "Install native lint tools"
              run: |
                  set -euo pipefail
                  go install github.com/zricethezav/gitleaks/v8@v8.30.1
                  echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
                  python -m pip install --user --disable-pip-version-check yamllint==1.38.0
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Run full verification pipeline"
              run: "npm run release:verify"
