# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release"

run-name: "Release ${{ github.ref_name || inputs.version || inputs.release_type }} @${{ github.actor }}"

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit release version in x.y.z format"
                required: false
                type: "string"
            ref:
                description: "Branch or ref to release from"
                required: false
                default: "main"
                type: "string"

defaults:
    run:
        shell: "bash"

permissions:
    contents: "write"
    id-token: "write"

concurrency:
    group: "release-${{ github.ref || inputs.version || inputs.release_type }}"
    cancel-in-progress: "${{ false }}"

jobs:
    release:
        name: "Publish"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20

        steps:
            - name: "Checkout"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
                  ref: "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}"

            - name: "Setup Node"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - name: "Install the repository npm version"
              run: "npm install --global npm@12.0.2"

            - name: "Resolve npm cache directory"
              id: "npm-cache"
              run: |
                  echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: "Cache npm downloads"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm-cache.outputs.directory }}"
                  key: "${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}"
                  restore-keys: "${{ runner.os }}-npm-"

            - name: "Install"
              run: "npm ci"

            - name: "Resolve release version"
              id: "vars"
              env:
                  EVENT_NAME: "${{ github.event_name }}"
                  INPUT_RELEASE_TYPE: "${{ inputs.release_type }}"
                  INPUT_VERSION: "${{ inputs.version }}"
              run: |
                  if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                    EXPLICIT_VERSION="${INPUT_VERSION}"
                    RELEASE_TYPE="${INPUT_RELEASE_TYPE}"

                    if [ -n "${EXPLICIT_VERSION}" ]; then
                      if ! [[ "${EXPLICIT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "version must be in x.y.z format" >&2
                        exit 1
                      fi
                      NEXT_VERSION="${EXPLICIT_VERSION}"
                    else
                      LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
                      BASE_VERSION="${LATEST_TAG#v}"
                      if [ -z "${LATEST_TAG}" ]; then
                        BASE_VERSION="$(node -p "require('./package.json').version")"
                      fi
                      IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"
                      case "${RELEASE_TYPE}" in
                        patch) PATCH=$((PATCH + 1)) ;;
                        minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                        major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                        *) echo "Unsupported release_type: ${RELEASE_TYPE}" >&2; exit 1 ;;
                      esac
                      NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    fi
                    TAG="v${NEXT_VERSION}"
                  else
                    TAG="${GITHUB_REF_NAME}"
                  fi

                  if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Resolved tag '${TAG}' is not in vX.Y.Z format" >&2
                    exit 1
                  fi

                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            - name: "Verify release target is unused"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  RELEASE_TAG: "${{ steps.vars.outputs.tag }}"
                  RELEASE_VERSION: "${{ steps.vars.outputs.version }}"
              run: |
                  set -euo pipefail

                  package_name="$(node -p "require('./package.json').name")"
                  published_versions="$(npm view "$package_name" versions --json)"
                  export published_versions RELEASE_VERSION

                  if node -e "const versions = JSON.parse(process.env.published_versions); process.exit(versions.includes(process.env.RELEASE_VERSION) ? 0 : 1)"; then
                    echo "::error::$package_name@$RELEASE_VERSION already exists on npm."
                    exit 1
                  fi

                  if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
                    echo "::error::Git tag $RELEASE_TAG already exists."
                    exit 1
                  fi

                  release_error="$(mktemp)"
                  if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --silent 2>"$release_error"; then
                    echo "::error::GitHub release $RELEASE_TAG already exists."
                    exit 1
                  fi
                  if ! grep -q "HTTP 404" "$release_error"; then
                    cat "$release_error" >&2
                    echo "::error::Could not verify whether GitHub release $RELEASE_TAG exists."
                    exit 1
                  fi

            - name: "Prepare package version"
              run: "npm version --allow-same-version --no-git-tag-version '${{ steps.vars.outputs.version }}'"

            - name: "Verify"
              run: "npm run release:verify"

            - name: "Prepare expected release tag for manual runs"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  EXPECTED_TAG: "${{ steps.vars.outputs.tag }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  if git show-ref --verify --quiet "refs/tags/${EXPECTED_TAG}"; then
                    echo "::error::Expected release tag ${EXPECTED_TAG} already exists; refusing to replace it during a manual release."
                    exit 1
                  fi

                  git tag "$EXPECTED_TAG" HEAD

            - name: "Validate expected release tag"
              env:
                  EXPECTED_TAG: "${{ steps.vars.outputs.tag }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  tag_ref="refs/tags/${EXPECTED_TAG}"
                  if ! git show-ref --verify --quiet "$tag_ref"; then
                    echo "::error::Expected release tag ${EXPECTED_TAG} does not exist in the local checkout."
                    exit 1
                  fi

                  tag_commit=$(git rev-parse "${tag_ref}^{commit}")
                  head_commit=$(git rev-parse HEAD)
                  if [ "$tag_commit" != "$head_commit" ]; then
                    echo "::error::Expected release tag ${EXPECTED_TAG} points to ${tag_commit}, but HEAD is ${head_commit}."
                    exit 1
                  fi

                  head_tags=$(git tag --points-at HEAD --sort=refname)
                  if [ "$head_tags" != "$EXPECTED_TAG" ]; then
                    echo "::error::HEAD must have exactly the expected release tag ${EXPECTED_TAG}; found: ${head_tags:-<none>}."
                    exit 1
                  fi

            - name: "Generate release notes"
              id: "git-cliff"
              uses: "orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5" # v4
              with:
                  config: "node_modules/gitcliff-config-nick2bad4u/cliff.toml"
                  args: "--verbose --tag ${{ steps.vars.outputs.tag }} --strip header"
              env:
                  OUTPUT: "release-notes.md"
                  GITHUB_REPO: "${{ github.repository }}"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Publish npm package"
              run: "npm publish --access public --provenance"

            - name: "Create GitHub release"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  NOTES: "${{ steps.git-cliff.outputs.changelog }}"
                  TAG: "${{ steps.vars.outputs.tag }}"
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release edit "$TAG" --notes-file "$NOTES"
                  else
                    gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES"
                  fi
